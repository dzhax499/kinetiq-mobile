name: kinetiq
description: "KinetiQ: Gamifikasi deteksi postur tubuh. Mobile party game interaktif berbasis Edge Intelligence dan Computer Vision."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter
  
  # Camera
  camera: ^0.11.0+2
  
  # ML & Pose Detection
  google_mlkit_pose_detection: ^0.12.0
  
  # Image Processing
  image: ^4.3.0
  
  # State Management
  provider: ^6.1.2
  
  # UI & Design
  google_fonts: ^6.2.1
  
  # Audio
  audioplayers: ^6.1.0
  
  # Utilities
  path_provider: ^2.1.4
  permission_handler: ^11.3.1
  collection: ^1.18.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

