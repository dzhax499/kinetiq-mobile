name: game_ramuan_pcd
description: "Game Ramuan PCD - Potion Recipe Game with Digital Image Processing"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.2.1
  audioplayers: ^6.4.0
  camera: ^0.12.0+1
  google_mlkit_pose_detection: ^0.14.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/potions/
    - assets/images/backgrounds/
    - assets/audio/
